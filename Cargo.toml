[workspace]
resolver = "3"

members = [
    "crates/latch-core",

    "crates/latch-substrate",
    "crates/latch-runtime",
    "crates/latch-sandbox",
    "crates/latch-transaction",

    "crates/latch-policy",
    "crates/latch-audit",

    "crates/latch-fs",
    "crates/latch-net",
    "crates/latch-ipc",

    "crates/latch-cli",
    "crates/latch-tui",
    "crates/latch-warden",

    "crates/latch-agents",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
authors = ["David"]
repository = "https://github.com/Rollocraft/latch"
homepage = "https://github.com/Rollocraft/latch"
readme = "README.md"
keywords = ["ai-agents", "security", "policy", "sandbox", "audit"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
