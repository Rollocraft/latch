name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
  # Lets a run be started by hand, e.g. when hosted runners were unavailable.
  workflow_dispatch:

# A newer push supersedes a run that is still queued or running for the same
# ref, so stale runs do not compete for hosted runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    # The filesystem layer behaves differently per platform - permission bits,
    # symbolic links, renaming over an existing file - so every platform the
    # runtime targets runs the suite.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # rust-toolchain.toml pins the version, so no toolchain is selected here.
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --all-targets
      - run: cargo test --workspace --doc

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets
